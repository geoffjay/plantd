# PlantD Production Alert Rules
# Phase 7: Production Deployment - Prometheus Alerting

groups:
  # Service Health Alerts
  - name: plantd.service.health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
          team: plantd
          component: service
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "Service {{ $labels.instance }} has been down for more than 30 seconds"
          runbook_url: "https://docs.plantd.com/runbooks/service-down"

      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: warning
          team: plantd
          component: http
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-error-rate"

      - alert: CriticalErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 15
        for: 1m
        labels:
          severity: critical
          team: plantd
          component: http
        annotations:
          summary: "Critical error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-error-rate"

  # Performance Alerts
  - name: plantd.performance
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: performance
        annotations:
          summary: "High latency on {{ $labels.instance }}"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-latency"

      - alert: CriticalLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2.0
        for: 2m
        labels:
          severity: critical
          team: plantd
          component: performance
        annotations:
          summary: "Critical latency on {{ $labels.instance }}"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-latency"

      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          team: plantd
          component: traffic
        annotations:
          summary: "High request rate on {{ $labels.instance }}"
          description: "Request rate is {{ $value }} req/s for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-traffic"

  # Resource Alerts
  - name: plantd.resources
    rules:
      - alert: HighCPUUsage
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: resources
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 95
        for: 2m
        labels:
          severity: critical
          team: plantd
          component: resources
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-cpu"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: resources
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-memory"

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          team: plantd
          component: resources
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-memory"

      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }}% for {{ $labels.mountpoint }} on {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/low-disk-space"

      - alert: CriticalDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 95
        for: 2m
        labels:
          severity: critical
          team: plantd
          component: storage
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }}% for {{ $labels.mountpoint }} on {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-disk-space"

  # Database Alerts
  - name: plantd.database
    rules:
      - alert: DatabaseConnectionFailure
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
          team: plantd
          component: database
        annotations:
          summary: "Database connection failure on {{ $labels.instance }}"
          description: "Cannot connect to PostgreSQL database on {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/database-connection"

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: database
        annotations:
          summary: "High database connections on {{ $labels.instance }}"
          description: "Database connections are at {{ $value }}% of max for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/high-db-connections"

      - alert: SlowDatabaseQueries
        expr: pg_stat_activity_max_tx_duration > 300
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: database
        annotations:
          summary: "Slow database queries on {{ $labels.instance }}"
          description: "Longest running query is {{ $value }}s on {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/slow-queries"

  # Security Alerts
  - name: plantd.security
    rules:
      - alert: HighFailedLogins
        expr: rate(http_requests_total{status="401"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          team: plantd
          component: security
        annotations:
          summary: "High failed login attempts on {{ $labels.instance }}"
          description: "Failed login rate is {{ $value }} req/s for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/failed-logins"

      - alert: SuspiciousTraffic
        expr: rate(http_requests_total{status=~"4.."}[5m]) > 50
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: security
        annotations:
          summary: "Suspicious traffic patterns on {{ $labels.instance }}"
          description: "High rate of 4xx errors: {{ $value }} req/s for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/suspicious-traffic"

      - alert: TLSCertificateExpiry
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: plantd
          component: security
        annotations:
          summary: "TLS certificate expiring soon for {{ $labels.instance }}"
          description: "TLS certificate expires in {{ $value }} days for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/cert-expiry"

      - alert: CriticalTLSCertificateExpiry
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
          team: plantd
          component: security
        annotations:
          summary: "TLS certificate expiring critically soon for {{ $labels.instance }}"
          description: "TLS certificate expires in {{ $value }} days for {{ $labels.instance }}"
          runbook_url: "https://docs.plantd.com/runbooks/critical-cert-expiry"

  # gRPC Specific Alerts
  - name: plantd.grpc
    rules:
      - alert: GRPCHighLatency
        expr: histogram_quantile(0.95, rate(grpc_server_handling_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: grpc
        annotations:
          summary: "High gRPC latency on {{ $labels.instance }}"
          description: "95th percentile gRPC latency is {{ $value }}s for {{ $labels.grpc_method }}"
          runbook_url: "https://docs.plantd.com/runbooks/grpc-latency"

      - alert: GRPCHighErrorRate
        expr: (rate(grpc_server_handled_total{grpc_code!="OK"}[5m]) / rate(grpc_server_handled_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: warning
          team: plantd
          component: grpc
        annotations:
          summary: "High gRPC error rate on {{ $labels.instance }}"
          description: "gRPC error rate is {{ $value }}% for {{ $labels.grpc_method }}"
          runbook_url: "https://docs.plantd.com/runbooks/grpc-errors"

  # Traefik Gateway Alerts
  - name: plantd.traefik
    rules:
      - alert: TraefikHighLatency
        expr: histogram_quantile(0.95, rate(traefik_request_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          team: plantd
          component: gateway
        annotations:
          summary: "High Traefik latency"
          description: "95th percentile Traefik latency is {{ $value }}s for {{ $labels.service }}"
          runbook_url: "https://docs.plantd.com/runbooks/traefik-latency"

      - alert: TraefikServiceUnavailable
        expr: traefik_service_requests_total{code="503"} > 0
        for: 1m
        labels:
          severity: critical
          team: plantd
          component: gateway
        annotations:
          summary: "Traefik service unavailable"
          description: "Service {{ $labels.service }} is returning 503 errors"
          runbook_url: "https://docs.plantd.com/runbooks/service-unavailable"

  # Backup and Recovery Alerts
  - name: plantd.backup
    rules:
      - alert: BackupFailure
        expr: time() - backup_last_success_timestamp > 86400
        for: 1h
        labels:
          severity: critical
          team: plantd
          component: backup
        annotations:
          summary: "Backup failure detected"
          description: "Last successful backup was more than 24 hours ago"
          runbook_url: "https://docs.plantd.com/runbooks/backup-failure"

      - alert: BackupAge
        expr: time() - backup_last_success_timestamp > 43200
        for: 1h
        labels:
          severity: warning
          team: plantd
          component: backup
        annotations:
          summary: "Backup is getting old"
          description: "Last successful backup was more than 12 hours ago"
          runbook_url: "https://docs.plantd.com/runbooks/backup-age" 
