# PlantD Production Logging Configuration
# Phase 7: Production Deployment - Fluent Bit Log Aggregation

[SERVICE]
    Flush           5
    Grace           30
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On
    storage.path    /tmp/flb-storage/
    storage.sync    normal
    storage.checksum off
    storage.backlog.mem_limit 5M

# Docker Container Logs Input
[INPUT]
    Name                tail
    Path                /var/lib/docker/containers/*/*.log
    multiline.parser    docker, cri
    Tag                 docker.*
    Refresh_Interval    5
    Rotate_Wait         30
    storage.type        filesystem
    Read_from_Head      false
    Skip_Long_Lines     true
    Buffer_Max_Size     32k

# Application Logs Input - PlantD Services
[INPUT]
    Name                tail
    Path                /app/logs/*.log
    Tag                 app.*
    Refresh_Interval    5
    Rotate_Wait         30
    Parser              json
    storage.type        filesystem
    Read_from_Head      false
    Skip_Long_Lines     true
    Buffer_Max_Size     32k

# Traefik Access Logs
[INPUT]
    Name                tail
    Path                /traefik/logs/access.log
    Tag                 traefik.access
    Refresh_Interval    5
    Parser              json
    storage.type        filesystem
    Read_from_Head      false
    Skip_Long_Lines     true
    Buffer_Max_Size     64k

# Traefik Error Logs
[INPUT]
    Name                tail
    Path                /traefik/logs/traefik.log
    Tag                 traefik.error
    Refresh_Interval    5
    Parser              json
    storage.type        filesystem
    Read_from_Head      false
    Skip_Long_Lines     true
    Buffer_Max_Size     32k

# System Metrics Input
[INPUT]
    Name                node_exporter_metrics
    Tag                 node.metrics
    Scrape_Interval     30
    Path.Procfs         /host/proc
    Path.Sysfs          /host/sys

# Docker Stats Input
[INPUT]
    Name                docker_events
    Tag                 docker.events

# Filter to parse Docker logs
[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              docker
    Reserve_Data        true
    Preserve_Key        true

# Filter to add Kubernetes-style metadata
[FILTER]
    Name                modify
    Match               docker.*
    Add                 cluster plantd-production
    Add                 environment production

# Filter to enrich Traefik logs
[FILTER]
    Name                modify
    Match               traefik.*
    Add                 service traefik
    Add                 component gateway
    Add                 environment production

# Filter to enrich application logs
[FILTER]
    Name                modify
    Match               app.*
    Add                 environment production
    Add                 cluster plantd-production

# Filter to parse log levels and add severity
[FILTER]
    Name                grep
    Match               *
    Exclude             level debug

# Filter for security events
[FILTER]
    Name                modify
    Match               traefik.access
    Condition           Key_value_matches status 4[0-9][0-9]|5[0-9][0-9]
    Add                 alert_level high
    Add                 event_type error

# Rate limiting filter to prevent log flooding
[FILTER]
    Name                throttle
    Match               *
    Rate                1000
    Window              300
    Interval            1s

# Output to stdout for development
[OUTPUT]
    Name                stdout
    Match               *
    Format              json_lines

# Output to Elasticsearch (if available)
[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Index               plantd-logs
    Type                _doc
    Generate_ID         On
    Replace_Dots        On
    Retry_Limit         5
    Buffer_Size         false
    tls                 Off
    tls.verify          Off

# Output to file for local storage
[OUTPUT]
    Name                file
    Match               *
    Path                /tmp/flb-storage
    File                plantd-production.log
    Format              json_lines

# Output critical errors to separate file
[OUTPUT]
    Name                file
    Match               *.error
    Path                /tmp/flb-storage
    File                plantd-errors.log
    Format              json_lines

# Output security events
[OUTPUT]
    Name                file
    Match_Regex         .*alert_level.*high.*
    Path                /tmp/flb-storage
    File                plantd-security.log
    Format              json_lines

# Health check output
[OUTPUT]
    Name                http
    Match               *.health
    Host                localhost
    Port                2020
    URI                 /api/v1/health
    Format              json

# Prometheus metrics output
[OUTPUT]
    Name                prometheus_exporter
    Match               node.metrics
    Host                0.0.0.0
    Port                2021 
