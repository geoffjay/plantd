---
server:
  endpoint: "https://localhost:8443"  # App service endpoint
  timeout: 30s
  retries: 3

# gRPC Configuration
grpc:
  gateway_endpoint: "https://localhost:8443"  # App service providing gRPC gateway
  timeout: 30s

identity:
  endpoint: "https://localhost:8443"  # App service for gRPC
  default_profile: "default"
  auto_refresh: true
  cache_duration: "5m"

defaults:
  service: "org.plantd.Client"
  output_format: "json"  # json, yaml, table
  use_grpc: true

profiles:
  default:
    identity_endpoint: "https://localhost:8443"
  production:
    identity_endpoint: "http://production:8080"
  staging:
    identity_endpoint: "http://staging:8080"
