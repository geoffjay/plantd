# State service configuration
log:
  level: info
  format: text

identity:
  endpoint: http://localhost:5002  # Identity service gRPC endpoint (corrected port)
  timeout: 30s
  retries: 3

database:
  path: ./plantd-state.db

health:
  port: 8081

# Transport configuration
transport:
  enable-grpc: true     # Enable gRPC transport
  grpc-port: "9080"     # Port for gRPC service
